name: CandyCorn
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  CandyCorn:
    type: application
    platform: iOS
    sources:
      - path: CandyCorn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.candycorn.app
        PRODUCT_NAME: CandyCorn
        INFOPLIST_FILE: CandyCorn/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        SWIFT_STRICT_CONCURRENCY: complete
  CandyCornTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CandyCornTests
    dependencies:
      - target: CandyCorn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.candycorn.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
schemes:
  CandyCorn:
    build:
      targets:
        CandyCorn: all
        CandyCornTests: [test]
    test:
      targets:
        - CandyCornTests
